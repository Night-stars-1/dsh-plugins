name: dsh

services:
  dsh:
    build: .
    ports:
      - "${DSH_PORT:-8080}:3080"
    volumes:
      # Harness 主目录：访问密钥、会话、设置、web profile。
      - dsh-data:/data
      # agent 工作区：目录选择器默认从容器 home（/root）开始浏览，
      # 因此直接挂到 /root，工作区文件会出现在选择器首页。
      - ./workspace:/root
    environment:
      # 模型访问（聊天必需）。
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      # 可选的固定访问密钥（空格分隔可多个）；不设也可以用页面管理的密钥。
      DSH_WEB_ACCESS_KEY: ${DSH_WEB_ACCESS_KEY:-}
      # 局域网/公网访问时额外信任的主机，空格分隔，
      # 例如 "192.168.1.5:8080 chat.example.com"。
      DSH_TRUSTED_HOSTS: ${DSH_TRUSTED_HOSTS:-}
      # 设为 1 时，容器启动会把插件升级到 npm 最新版（保留数据）。
      # deploy.sh update 会临时置 1 跑一次；平时留空。
      DSH_PLUGIN_UPDATE: ${DSH_PLUGIN_UPDATE:-}
      # 设为 true/1/yes/on 时，已认证的远程会话可访问设置/凭据等特权面
      # （密钥管理仍仅限本机）。改后执行 bash deploy.sh restart 生效。
      DSH_ALLOW_REMOTE_ADMIN: ${DSH_ALLOW_REMOTE_ADMIN:-}
    restart: unless-stopped

volumes:
  dsh-data:
