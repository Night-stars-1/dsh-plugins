name: dsh

services:
  dsh:
    build: .
    ports:
      - "${DSH_PORT:-8080}:3080"
    volumes:
      # Harness 主目录：访问密钥、会话、设置、web profile。
      - dsh-data:/data
      # agent 工作区：把想让 agent 操作的宿主机目录挂到这里。
      - ./workspace:/workspace
    environment:
      # 模型访问（聊天必需）。
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      # 可选的固定访问密钥（空格分隔可多个）；不设也可以用页面管理的密钥。
      DSH_WEB_ACCESS_KEY: ${DSH_WEB_ACCESS_KEY:-}
      # 局域网/公网访问时额外信任的主机，空格分隔，
      # 例如 "192.168.1.5:8080 chat.example.com"。
      DSH_TRUSTED_HOSTS: ${DSH_TRUSTED_HOSTS:-}
    restart: unless-stopped

volumes:
  dsh-data:
